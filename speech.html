<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel | Architect Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;800;900&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --active-green: #10b981; }
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; background: #000; margin: 0; color: #FFF; font-family: 'Inter'; }
        #dynamic-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.12) 0%, transparent 60%); z-index: 0; }
        
        @keyframes pageEnter { from { opacity: 0; transform: translateY(15px); filter: blur(10px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .content-scroll { position: relative; z-index: 10; height: 100%; overflow-y: auto; padding: 25px; padding-bottom: 150px; animation: pageEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .glass-card { background: rgba(255, 255, 255, 0.01); backdrop-filter: blur(80px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 24px; }
        
        /* NAVIGATION */
        #nav-container { position: fixed; top: 30px; left: 25px; z-index: 5000; display: flex; align-items: center; }
        .nav-trigger { width: 42px; height: 12px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: 0.6s; flex-shrink: 0; }
        .nav-trigger.open { width: 12px; height: 12px; border-radius: 50%; background: var(--active-green); box-shadow: 0 0 20px var(--active-green); }
        #nav-menu { display: flex; align-items: center; width: 0; opacity: 0; overflow: hidden; background: rgba(255,255,255,0.02); backdrop-filter: blur(50px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; }
        #nav-menu.active { width: 340px; opacity: 1; margin-left: 15px; padding: 4px; }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; color: white; opacity: 0.3; transition: 0.3s; text-decoration: none; }
        .nav-item.active { opacity: 1; color: var(--active-green); background: rgba(255, 255, 255, 0.03); }
        .nav-icon-svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* CALENDAR */
        #calendar-overlay { position: fixed; inset: 0; z-index: 6000; background: rgba(0,0,0,0.95); backdrop-filter: blur(120px); display: none; flex-direction: column; padding: 120px 25px 50px; animation: pageEnter 0.5s ease; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 30px; }
        .calendar-day { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Syncopate'; font-size: 7px; cursor: pointer; }
        .calendar-day.has-data { border-color: var(--active-green); background: rgba(16, 185, 129, 0.05); }

        /* FOLDERS */
        .day-folder-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .day-folder-content { overflow: hidden; max-height: 0; transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .day-folder-content.open { max-height: 5000px; padding-top: 20px; }
        .folder-arrow { transition: 0.3s; opacity: 0.3; font-size: 8px; }
        .day-folder-header.open .folder-arrow { transform: rotate(90deg); opacity: 1; color: var(--active-green); }

        /* REPORT UI */
        .report-card { background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, transparent 100%); border-left: 2px solid var(--active-green); padding: 25px; border-radius: 0 15px 15px 0; margin-top: 15px; }
        .label { font-family: 'Syncopate'; font-size: 7px; color: rgba(255,255,255,0.2); text-transform: uppercase; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>
    <div id="dynamic-glow"></div>

    <div id="calendar-overlay">
        <div class="flex justify-between items-center mb-8 px-4">
            <h2 class="font-syncopate text-xl italic font-bold tracking-tighter text-[#10b981]">SYSTEM LOGS</h2>
            <button onclick="toggleCalendar()" class="font-syncopate text-[10px] border border-white/20 px-4 py-2 rounded-full">CLOSE</button>
        </div>
        <div id="calendar-render"></div>
    </div>

    <div id="nav-container">
        <div class="nav-trigger" id="trigger" onclick="toggleNav(event)"></div>
        <div id="nav-menu">
            <a href="index.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">HQ</span>
            </a>
            <a href="#" class="nav-item" onclick="toggleCalendar()">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Logs</span>
            </a>
            <a href="fuel.html" class="nav-item active">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 7V12l3 3"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Fuel</span>
            </a>
            <a href="speech.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="2" y="10" width="3" height="4"/><rect x="8" y="6" width="3" height="12"/><rect x="14" y="3" width="3" height="18"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Speech</span>
            </a>
        </div>
    </div>

    <div id="scan-overlay" class="hidden fixed inset-0 z-[10000] bg-black/95 flex flex-col items-center justify-center">
        <div class="w-full max-w-xs border-l border-[#10b981] pl-5">
            <div class="diag-line" id="l1">> ARCHITECT_CORE CONNECTED</div>
            <div class="diag-line" id="l2">> UPLOADING BIOMASS...</div>
            <div class="diag-line" id="l3">> GROK ENGINE ANALYSIS...</div>
            <div class="diag-line" id="l4">> DATA DEPLOYED.</div>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">

    <div class="content-scroll">
        <header class="mb-12 pt-14 text-center">
            <p class="font-mono text-[10px] text-[#10b981] tracking-[0.7em] uppercase font-bold">Architect Protocol</p>
            <h1 class="font-syncopate text-4xl font-bold italic">Fuel Intake</h1>
        </header>

        <section class="mb-12 text-center">
            <span id="total-kcal-display" class="font-syncopate font-black text-[28vw] leading-none">0</span>
            <p class="font-mono text-[11px] text-[#10b981] tracking-[0.8em] uppercase">Daily Kilo-Calories</p>
        </section>

        <div class="mx-auto flex items-center justify-center w-20 h-20 border-2 border-[#10b981] rounded-full mb-12 cursor-pointer transition-all active:scale-90" onclick="document.getElementById('camera-input').click()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>

        <div id="meal-list" class="space-y-4"></div>
    </div>

<script>
    // --- BIOLOGIC PROFILE (Mifflin-St Jeor) ---
    const profile = { weight: 75, height: 180, age: 25, sex: 'M', activity: 1.2, objective: 'Loss' };
    
    let protocolData = JSON.parse(localStorage.getItem('architect_fuel_v1')) || {};
    let debugDateOffset = 0;

    function calculateDailyTarget() {
        let bmr = (10 * profile.weight) + (6.25 * profile.height) - (5 * profile.age);
        bmr = profile.sex === 'M' ? bmr + 5 : bmr - 161;
        let tdee = bmr * profile.activity;
        return profile.objective === 'Loss' ? Math.round(tdee - 500) : Math.round(tdee + 300);
    }

    function getTodayKey() {
        const d = new Date();
        d.setDate(d.getDate() + debugDateOffset);
        return `kcal count ${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()}`;
    }

    // --- NAVIGATION & FOLDERS ---
    function toggleNav(e) {
        e.stopPropagation();
        document.getElementById('nav-menu').classList.toggle('active');
        document.getElementById('trigger').classList.toggle('open');
    }

    function toggleCalendar() {
        const el = document.getElementById('calendar-overlay');
        el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
        if (el.style.display === 'flex') renderCalendar();
    }

    function toggleFolder(id) {
        const content = document.getElementById(id);
        const header = content.previousElementSibling;
        const isOpen = content.classList.contains('open');
        
        // Ferme tous les autres
        document.querySelectorAll('.day-folder-content').forEach(c => c.classList.remove('open'));
        document.querySelectorAll('.day-folder-header').forEach(h => h.classList.remove('open'));
        
        if (!isOpen) {
            content.classList.add('open');
            header.classList.add('open');
        }
    }

    function jumpToDate(key) {
        toggleCalendar();
        renderHistory(); // Force refresh
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-render');
        const now = new Date();
        container.innerHTML = `<div class="calendar-grid" id="grid-days"></div>`;
        const grid = document.getElementById('grid-days');
        for(let i = 1; i <= 31; i++) {
            const dateStr = `${i.toString().padStart(2, '0')}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()}`;
            const key = `kcal count ${dateStr}`;
            const dayData = protocolData[key];
            grid.innerHTML += `
                <div class="calendar-day ${dayData ? 'has-data' : ''}" onclick="jumpToDate('${key}')">
                    <span class="opacity-30">${i}</span>
                    <span class="text-[9px] font-bold text-[#10b981]">${dayData?.report?.score ? dayData.report.score + '/10' : ''}</span>
                </div>`;
        }
    }

    // --- ANALYZE & SCAN ---
    document.getElementById('camera-input').onchange = async (e) => {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.readAsDataURL(e.target.files[0]);
            reader.onload = async () => {
                const img = new Image();
                img.src = reader.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = Math.min(1, 800 / Math.max(img.width, img.height));
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    await runDiagnosis(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        }
    };

    async function runDiagnosis(base64Image) {
        const overlay = document.getElementById('scan-overlay');
        overlay.classList.remove('hidden');
        ['l1','l2','l3'].forEach((id, i) => setTimeout(() => document.getElementById(id).classList.add('active'), i * 600));

        try {
            const response = await fetch("/.netlify/functions/analyze", { method: "POST", body: JSON.stringify({ image: base64Image }) });
            const aiResult = await response.json();
            
            // Professional Jitter
            if(aiResult.kcal % 10 === 0) aiResult.kcal += (Math.random() > 0.5 ? 3 : -2);

            const dateKey = getTodayKey();
            if (!protocolData[dateKey]) protocolData[dateKey] = { meals: [], report: null };
            protocolData[dateKey].meals.push({ ...aiResult, img: base64Image, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('architect_fuel_v1', JSON.stringify(protocolData));

            document.getElementById('l4').classList.add('active');
            setTimeout(() => { 
                overlay.classList.add('hidden');
                ['l1','l2','l3','l4'].forEach(id => document.getElementById(id).classList.remove('active'));
                renderHistory();
                updateTotalDisplay();
            }, 1000);
        } catch (err) { alert("Logic Link Error."); overlay.classList.add('hidden'); }
    }

    // --- GENERATE REPORT ---
    async function generateReport(dateKey) {
        const reportDiv = document.getElementById(`report-${dateKey.replace(/\//g, '-')}`);
        reportDiv.innerHTML = `<p class="text-[8px] font-syncopate animate-pulse text-center mt-4 text-[#10b981]">NEURAL ANALYSIS IN PROGRESS...</p>`;
        
        try {
            const target = calculateDailyTarget();
            const dayData = protocolData[dateKey];
            const total = dayData.meals.reduce((s,m)=>s+m.kcal, 0);
            
            const res = await fetch("/.netlify/functions/summary", {
                method: "POST",
                body: JSON.stringify({ meals: dayData.meals, totalKcal: total, targetKcal: target, profile: profile })
            });
            const report = await res.json();
            protocolData[dateKey].report = report;
            localStorage.setItem('architect_fuel_v1', JSON.stringify(protocolData));
            renderHistory();
        } catch (e) { reportDiv.innerHTML = "Neural Link failed."; }
    }

    function renderHistory() {
        const list = document.getElementById('meal-list');
        list.innerHTML = '';
        const todayKey = getTodayKey();
        const sortedDates = Object.keys(protocolData).sort((a,b) => b.localeCompare(a));

        sortedDates.forEach(date => {
            const day = protocolData[date];
            const isOpen = date === todayKey;
            const folderId = `folder-${date.replace(/\//g, '-')}`;
            const dayTotal = day.meals.reduce((s,m)=>s+m.kcal,0);
            
            const section = document.createElement('div');
            section.innerHTML = `
                <div class="day-folder-header ${isOpen ? 'open' : ''}" onclick="toggleFolder('${folderId}')">
                    <span class="font-syncopate text-[10px] font-bold flex items-center">
                        <span class="folder-arrow mr-3">▶</span>${date}
                    </span>
                    <span class="font-syncopate text-[9px] opacity-40">${dayTotal} KCAL</span>
                </div>
                <div id="${folderId}" class="day-folder-content ${isOpen ? 'open' : ''} space-y-4">
                    ${day.meals.map(m => `
                        <div class="glass-card">
                            <div class="flex justify-between items-start mb-4">
                                <span class="meal-badge">Deploy • ${m.time}</span>
                                <span class="font-syncopate font-black text-3xl text-white">${m.kcal}</span>
                            </div>
                            <div class="flex gap-4">
                                <img src="${m.img}" class="w-20 h-20 rounded-xl object-cover grayscale">
                                <div class="flex-1"><h3 class="font-syncopate text-[11px] text-[#10b981]">${m.name}</h3><p class="text-[9px] opacity-50 uppercase mt-1 tracking-tighter">${m.ingredients.join(' • ')}</p></div>
                            </div>
                        </div>`).join('')}
                    <button onclick="generateReport('${date}')" class="w-full py-4 border border-[#10b981]/30 rounded-xl font-syncopate text-[8px] tracking-[0.3em] hover:bg-[#10b981]/10 uppercase transition-all">Generate Architect Report</button>
                    <div id="report-${date.replace(/\//g, '-')}" class="mt-4">
                        ${day.report ? `
                        <div class="report-card animate-entrance">
                            <div class="flex justify-between items-center mb-3">
                                <span class="label">Daily Rating</span><span class="text-[#10b981] font-syncopate font-black text-2xl">${day.report.score}/10</span>
                            </div>
                            <p class="text-[#10b981] text-[10px] font-bold mb-2 uppercase tracking-widest">${day.report.status}</p>
                            <p class="text-[11px] font-bold mb-4 tracking-tighter">${day.report.summary}</p>
                            <span class="label">Biologic Impact</span><p class="text-[10px] mb-4 opacity-80">${day.report.bodyImpact}</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div><span class="label text-green-400">Pros</span><p class="text-[9px]">${day.report.pros}</p></div>
                                <div><span class="label text-red-400">Cons</span><p class="text-[9px]">${day.report.cons}</p></div>
                            </div>
                        </div>` : ''}
                    </div>
                </div>`;
            list.appendChild(section);
        });
    }

    function updateTotalDisplay() {
        const todayKey = getTodayKey();
        const meals = protocolData[todayKey]?.meals || [];
        document.getElementById('total-kcal-display').innerText = meals.reduce((s,m) => s + m.kcal, 0);
    }

    function simulateDate(offset) { debugDateOffset = offset; renderHistory(); updateTotalDisplay(); }
    window.onload = () => { renderHistory(); updateTotalDisplay(); };
    window.onclick = (e) => { if (!document.getElementById('nav-container').contains(e.target)) { document.getElementById('nav-menu').classList.remove('active'); document.getElementById('trigger').classList.remove('open'); } };
</script>
</body>
</html>
