<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speech | Architect Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --glow: #FF3366; } /* Couleur par défaut au chargement */

        html, body { 
            position: fixed; width: 100%; height: 100%; 
            overflow: hidden; background: #000000; margin: 0;
            touch-action: pan-y; color: #FFFFFF; font-family: 'Inter', sans-serif;
        }

        /* --- BACKGROUND DYNAMICS --- */
        .main-wrapper { 
            position: relative; width: 100vw; height: 100vh; 
            display: flex; overflow: hidden;
            mask-image: linear-gradient(to right, black 60%, transparent 95%);
            -webkit-mask-image: linear-gradient(to right, black 60%, transparent 95%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #dynamic-glow { 
            position: absolute; inset: 0; z-index: 0; 
            background: radial-gradient(circle at 90% 50%, rgba(255, 51, 102, 0.2) 0%, transparent 75%); 
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .visual-anchor { position: absolute; right: -45vw; top: 50%; transform: translateY(-50%); width: 160vw; height: 160vw; max-width: 650px; max-height: 650px; z-index: -1; pointer-events: none; opacity: 0.3; }
        .rotating-arc { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.05); border-left: 6px solid #FF3366; filter: blur(4px); transform: rotate(-30deg); transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* --- NAVIGATION GHOST PILL (DYNAMIC GLOW) --- */
        #nav-container {
            position: fixed; top: 30px; left: 25px; z-index: 5000;
            display: flex; align-items: center; pointer-events: auto;
        }

        .nav-trigger {
            width: 42px; height: 12px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.6s cubic-bezier(0.68, -0.6, 0.32, 1.6);
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* RAYON LUMINEUX DYNAMIQUE (GLOSSY) */
        .nav-trigger::after {
            content: ""; position: absolute; top: 0; left: -100%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--glow), transparent);
            animation: glossMove 4s infinite ease-in-out;
        }

        @keyframes glossMove { 0% { left: -100%; } 30% { left: 120%; } 100% { left: 120%; } }

        .nav-trigger.open { 
            width: 12px; height: 12px; border-radius: 50%; 
            background: var(--glow); border-color: var(--glow);
            box-shadow: 0 0 20px var(--glow);
        }
        .nav-trigger.open::after { display: none; }

        #nav-menu {
            display: flex; align-items: center; justify-content: space-around;
            width: 0; opacity: 0; overflow: hidden;
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap; transform: translateX(-10px);
        }

        #nav-menu.active { width: 340px; opacity: 1; margin-left: 15px; padding: 4px; transform: translateX(0); }

        .nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; color: white; opacity: 0.3; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--glow); background: rgba(255, 255, 255, 0.03); }
        .nav-icon-svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* --- UI COMPONENTS --- */
        .stat-display { position: absolute; right: 5vw; top: 52%; transform: translateY(-50%); text-align: right; z-index: 2; }
        .big-number { font-family: 'Syncopate'; font-size: 32vw; font-weight: 900; line-height: 0.8; letter-spacing: -2vw; transition: all 0.8s ease; opacity: 0.9; }
        .content-overlay { position: relative; z-index: 10; width: 95%; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; padding-left: 10vw; padding-top: 12vh; backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
        .speech-item { transition: all 0.6s ease; cursor: pointer; margin-bottom: 50px; opacity: 0.15; }
        .speech-item.active { opacity: 1; transform: translateX(20px); }
        .tag { padding: 6px 14px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; border: 1.5px solid currentColor; margin-bottom: 15px; display: inline-block; }
        .item-details { transition: all 0.5s ease; opacity: 0; transform: translateY(10px); }
        .active .item-details { opacity: 1; transform: translateY(0); transition-delay: 0.2s; }
        .lib-btn { margin-top: 25px; padding: 18px 45px; border-radius: 100px; font-family: 'Syncopate'; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3em; background: rgba(255, 255, 255, 0.08); border: 2px solid currentColor; display: none; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }
        .active .lib-btn { display: inline-block; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

        #library-overlay { position: fixed; inset: 0; z-index: 1000; background-color: #000000; background-image: radial-gradient(circle at 50% 20%, var(--active-color-glow, rgba(255,255,255,0.1)) 0%, transparent 70%); backdrop-filter: blur(80px); -webkit-backdrop-filter: blur(80px); display: none; flex-direction: column; padding: 30px; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        #library-overlay.open { display: flex; transform: translateY(0); }
        .back-btn { font-family: 'Syncopate'; font-size: 10px; font-weight: 700; color: white; border: 1.5px solid rgba(255,255,255,0.2); padding: 12px 24px; border-radius: 100px; }
        #transcription-container { flex-grow: 1; overflow-y: auto !important; height: 60vh; pointer-events: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); padding: 30vh 10vw; margin-top: 20px; }
        .lyric-line { font-size: 36px; font-weight: 800; color: #FFFFFF; opacity: 0.05; filter: blur(5px); text-align: left; margin-bottom: 50px; transition: all 0.5s cubic-bezier(0.2, 0, 0.2, 1); transform: scale(0.85); transform-origin: left center; line-height: 1.1; cursor: pointer; }
        .lyric-line.active { opacity: 1; filter: blur(0px); transform: scale(1.1); text-shadow: 0 0 40px var(--active-color-glow); }
        .progress-bar-container { height: 4px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 30px 0; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: white; transition: width 0.1s linear; }
        .bg-scale-down { transform: scale(0.95); filter: brightness(0.4); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <audio id="audio-player" preload="auto"></audio>

    <div id="nav-container">
        <div class="nav-trigger" id="trigger" onclick="toggleNav(event)"></div>
        <div id="nav-menu">
            <a href="index.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">HQ</span>
            </a>
            <a href="neural.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Neural</span>
            </a>
            <a href="fuel.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 7V12l3 3"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Fuel</span>
            </a>
            <a href="speech.html" class="nav-item active">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="2" y="10" width="3" height="4"/><rect x="8" y="6" width="3" height="12"/><rect x="14" y="3" width="3" height="18"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Speech</span>
            </a>
        </div>
    </div>

    <div class="main-wrapper" id="app-body">
        <div id="dynamic-glow"></div>
        <div class="visual-anchor"><div class="rotating-arc" id="arc"></div></div>
        <div class="stat-display"><div class="big-number" id="mainNum">01</div></div>

        <div class="content-overlay">
            <header class="mb-10">
                <p class="font-mono text-[11px] text-[#C9A050] tracking-[0.7em] uppercase font-bold mb-4">Architect Protocol</p>
                <h1 class="font-syncopate text-5xl font-bold tracking-tighter uppercase leading-none italic">Speech</h1>
            </header>

            <div id="list">
                <div class="speech-item active" onclick="update(0, '#FF3366', '01')">
                    <span class="tag text-[#FF3366] bg-[#FF336620]">Discipline</span>
                    <div class="item-details">
                        <h2 class="font-syncopate text-2xl font-bold uppercase text-white">Iron Mind</h2>
                        <button class="lib-btn text-[#FF3366]" onclick="openCategory('iron-mind', '#FF3366')">Enter Archive</button>
                    </div>
                </div>
                <div class="speech-item" onclick="update(1, '#C9A050', '02')">
                    <span class="tag text-[#C9A050] bg-[#C9A05020]">Wealth</span>
                    <div class="item-details">
                        <h2 class="font-syncopate text-2xl font-bold uppercase text-white">Capital</h2>
                        <button class="lib-btn text-[#C9A050]" onclick="openCategory('capital', '#C9A050')">Enter Archive</button>
                    </div>
                </div>
                <div class="speech-item" onclick="update(2, '#00FFFF', '03')">
                    <span class="tag text-[#00FFFF] bg-[#00FFFF20]">Neural</span>
                    <div class="item-details">
                        <h2 class="font-syncopate text-2xl font-bold uppercase text-white">Focus</h2>
                        <button class="lib-btn text-[#00FFFF]" onclick="openCategory('neural', '#00FFFF')">Enter Archive</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="library-overlay">
        <div class="flex justify-between items-center mb-10">
            <button onclick="handleBack()" class="back-btn">← Back</button>
            <h2 id="lib-title" class="font-syncopate text-sm font-bold uppercase italic text-white/40 tracking-widest">Archive</h2>
        </div>
        <div id="player-view" style="display: none;">
            <div class="text-center px-6">
                <h3 id="track-name" class="font-syncopate text-xl font-black uppercase tracking-tight">Transmission</h3>
                <div class="progress-bar-container"><div id="progress-fill"></div></div>
            </div>
            <div id="transcription-container"></div>
        </div>
        <div id="track-selection"></div>
    </div>

<script>
    const navTrigger = document.getElementById('trigger');
    const navMenu = document.getElementById('nav-menu');

    function toggleNav(e) {
        e.stopPropagation();
        navMenu.classList.toggle('active');
        navTrigger.classList.toggle('open');
    }

    window.onclick = (e) => {
        if (!document.getElementById('nav-container').contains(e.target)) {
            navMenu.classList.remove('active');
            navTrigger.classList.remove('open');
        }
    };

    // --- MISE À JOUR DYNAMIQUE (DORÉ, ROUGE, CYAN) ---
    function update(index, color, n) {
        document.querySelectorAll('.speech-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.speech-item')[index].classList.add('active');
        
        // Mise à jour de la pilule
        document.documentElement.style.setProperty('--glow', color);
        
        const num = document.getElementById('mainNum');
        num.style.color = color; num.innerText = n;
        document.getElementById('arc').style.borderLeftColor = color;
        document.getElementById('arc').style.transform = `rotate(${index * 45 - 30}deg)`;
        document.getElementById('dynamic-glow').style.background = `radial-gradient(circle at 90% 50%, ${color}44 0%, transparent 75%)`;
    }

    // Le reste de ton script (Audio, initLibrary, etc.) reste identique
    const audio = document.getElementById('audio-player');
    let audioLibrary = []; 
    let currentLyricsData = [];
    let lastIndex = -1;

    async function initLibrary() {
        try {
            const response = await fetch('audio/library.json');
            if (!response.ok) throw new Error("library.json non trouvé");
            audioLibrary = await response.json();
        } catch (err) {
            console.error(err);
        }
    }
    window.onload = initLibrary;

    function handleBack() {
        const playerView = document.getElementById('player-view');
        const selectionContainer = document.getElementById('track-selection');
        if (playerView.style.display === 'block') {
            audio.pause();
            playerView.style.display = 'none';
            selectionContainer.style.display = 'flex';
            document.getElementById('lib-title').innerText = "Archive";
        } else {
            closeLibrary();
        }
    }

    function openCategory(folderName, color) {
        const overlay = document.getElementById('library-overlay');
        const selectionContainer = document.getElementById('track-selection');
        overlay.style.setProperty('--active-color-glow', color);
        selectionContainer.style.display = 'flex';
        document.getElementById('player-view').style.display = 'none';
        selectionContainer.innerHTML = ''; 
        const filtered = audioLibrary.filter(track => track.folder === folderName);
        filtered.forEach(track => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.style.setProperty('--active-color-glow', color);
            card.innerHTML = `<h3 class="font-syncopate font-bold text-lg">${track.title}</h3>`;
            card.onclick = () => loadTrack(track);
            selectionContainer.appendChild(card);
        });
        overlay.style.display = 'flex';
        document.getElementById('app-body').classList.add('bg-scale-down');
        setTimeout(() => overlay.classList.add('open'), 10);
    }

    async function loadTrack(track) {
        document.getElementById('track-selection').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        document.getElementById('track-name').innerText = track.title;
        document.getElementById('audio-player').src = `audio/${track.folder}/${track.id}.mp3`;
        audio.play();
    }

    function closeLibrary() {
        const overlay = document.getElementById('library-overlay');
        overlay.classList.remove('open');
        document.getElementById('app-body').classList.remove('bg-scale-down');
        setTimeout(() => overlay.style.display = 'none', 600);
    }
</script>
</body>
</html>
