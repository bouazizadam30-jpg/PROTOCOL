<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speech | Architect Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --glow: #FF3366; }
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; background: #000; margin: 0; touch-action: pan-y; color: #FFF; font-family: 'Inter'; }

        /* --- ANIMATION D'ENTRÉE --- */
        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(15px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .main-wrapper { animation: pageEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* --- BACKGROUND DYNAMICS --- */
        #dynamic-glow { position: absolute; inset: 0; background: radial-gradient(circle at 90% 50%, rgba(255, 51, 102, 0.2) 0%, transparent 75%); transition: all 1.2s ease; }
        .visual-anchor { position: absolute; right: -45vw; top: 50%; transform: translateY(-50%); width: 160vw; height: 160vw; max-width: 650px; opacity: 0.3; }
        .rotating-arc { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.05); border-left: 6px solid var(--glow); filter: blur(4px); transform: rotate(-30deg); transition: 1s ease-out; }

        /* --- NAVIGATION GHOST PILL --- */
        #nav-container { position: fixed; top: 30px; left: 25px; z-index: 5000; display: flex; align-items: center; }
        .nav-trigger { width: 42px; height: 12px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: 0.6s; flex-shrink: 0; }
        .nav-trigger.open { width: 12px; height: 12px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 20px var(--glow); }
        #nav-menu { display: flex; align-items: center; width: 0; opacity: 0; overflow: hidden; background: rgba(255,255,255,0.02); backdrop-filter: blur(50px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; }
        #nav-menu.active { width: 325px; opacity: 1; margin-left: 15px; padding: 4px; }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; color: white; opacity: 0.3; transition: 0.3s; text-decoration: none; }
        .nav-item.active { opacity: 1; color: var(--glow); background: rgba(255, 255, 255, 0.03); }
        .nav-icon-svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* --- UI COMPONENTS --- */
        .stat-display { position: absolute; right: 5vw; top: 52%; transform: translateY(-50%); text-align: right; }
        .big-number { font-family: 'Syncopate'; font-size: 32vw; font-weight: 900; line-height: 0.8; letter-spacing: -2vw; opacity: 0.9; }
        .content-overlay { position: relative; z-index: 10; padding-left: 10vw; padding-top: 12vh; }
        .speech-item { transition: 0.6s; cursor: pointer; margin-bottom: 50px; opacity: 0.15; }
        .speech-item.active { opacity: 1; transform: translateX(20px); }
        .tag { padding: 6px 14px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; border: 1.5px solid currentColor; margin-bottom: 15px; display: inline-block; }
        .lib-btn { margin-top: 25px; padding: 18px 45px; border-radius: 100px; font-family: 'Syncopate'; font-size: 11px; font-weight: 900; background: rgba(255,255,255,0.08); border: 2px solid currentColor; display: none; }
        .active .lib-btn { display: inline-block; }

        /* --- LIBRARY OVERLAY --- */
        #library-overlay { 
            position: fixed; inset: 0; z-index: 1000; background: #000; 
            background-image: radial-gradient(circle at 50% 20%, var(--glow) 0%, transparent 70%); 
            backdrop-filter: blur(80px); display: none; flex-direction: column; 
            padding: 80px 30px 30px; /* BAISSÉ : Padding haut augmenté pour le bouton Back */
            transform: translateY(100%); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        #library-overlay.open { display: flex; transform: translateY(0); }
        
        /* BACK BUTTON PILL (FIXED STYLE) */
        .back-btn { 
            font-family: 'Syncopate'; font-size: 10px; font-weight: 700; color: white; 
            background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.2); 
            padding: 12px 28px; border-radius: 100px; transition: 0.3s;
        }

        #track-selection { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 40px; }
        .track-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 25px 15px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.4s; }

        /* SCROLL ENGINE FIX */
        #transcription-container { 
            flex: 1; /* Occupe tout l'espace restant pour permettre le scroll */
            overflow-y: auto; 
            padding: 35vh 10vw; /* Créé la zone morte pour le centrage Apple */
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%); 
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%); 
            scroll-behavior: smooth;
        }
        .lyric-line { font-size: 32px; font-weight: 800; opacity: 0.05; filter: blur(5px); margin-bottom: 40px; transition: 0.5s; transform: scale(0.9); transform-origin: left; }
        .lyric-line.active { opacity: 1; filter: blur(0); transform: scale(1.1); text-shadow: 0 0 30px var(--glow); }
        
        .progress-bar-container { height: 4px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 30px 0; overflow: hidden; flex-shrink: 0; }
        #progress-fill { height: 100%; width: 0%; background: #FFF; transition: width 0.2s linear; }
        .bg-scale-down { transform: scale(0.95); filter: brightness(0.4); }
    </style>
</head>
<body>
    <audio id="audio-player"></audio>

    <div id="nav-container">
        <div class="nav-trigger" id="trigger" onclick="toggleNav(event)"></div>
        <div id="nav-menu">
            <a href="index.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">HQ</span>
            </a>
            <a href="neural.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Neural</span>
            </a>
            <a href="fuel.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 7V12l3 3"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Fuel</span>
            </a>
            <a href="speech.html" class="nav-item active">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="2" y="10" width="3" height="4"/><rect x="8" y="6" width="3" height="12"/><rect x="14" y="3" width="3" height="18"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Speech</span>
            </a>
        </div>
    </div>

    <div class="main-wrapper" id="app-body">
        <div id="dynamic-glow"></div>
        <div class="visual-anchor"><div class="rotating-arc" id="arc"></div></div>
        <div class="stat-display"><div class="big-number" id="mainNum">01</div></div>

        <div class="content-overlay">
            <header class="mb-10">
                <p class="font-mono text-[11px] text-[#C9A050] tracking-[0.7em] uppercase font-bold mb-4">Architect Protocol</p>
                <h1 class="font-syncopate text-5xl font-bold leading-none italic">Speech</h1>
            </header>

            <div id="list">
                <div class="speech-item active" onclick="update(0, '#FF3366', '01')">
                    <span class="tag text-[#FF3366]">Discipline</span>
                    <div class="item-details">
                        <h2 class="font-syncopate text-2xl font-bold uppercase">Iron Mind</h2>
                        <button class="lib-btn text-[#FF3366]" onclick="openCategory('iron-mind', '#FF3366')">Enter Archive</button>
                    </div>
                </div>
                <div class="speech-item" onclick="update(1, '#C9A050', '02')">
                    <span class="tag text-[#C9A050]">Wealth</span>
                    <div class="item-details">
                        <h2 class="font-syncopate text-2xl font-bold uppercase">Capital</h2>
                        <button class="lib-btn text-[#C9A050]" onclick="openCategory('capital', '#C9A050')">Enter Archive</button>
                    </div>
                </div>
                <div class="speech-item" onclick="update(2, '#00FFFF', '03')">
                    <span class="tag text-[#00FFFF]">Neural</span>
                    <div class="item-details">
                        <h2 class="font-syncopate text-2xl font-bold uppercase">Focus</h2>
                        <button class="lib-btn text-[#00FFFF]" onclick="openCategory('neural', '#00FFFF')">Enter Archive</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="library-overlay">
        <div class="flex justify-between items-center mb-6">
            <button onclick="handleBack()" class="back-btn">← Back</button>
            <h2 id="lib-title" class="font-syncopate text-sm font-bold uppercase text-white/40 tracking-widest">Archive</h2>
        </div>
        <div id="player-view" style="display: none;" class="flex flex-col h-full overflow-hidden">
            <div class="text-center px-6 flex-shrink-0">
                <h3 id="track-name" class="font-syncopate text-xl font-black uppercase">Transmission</h3>
                <div class="progress-bar-container"><div id="progress-fill"></div></div>
            </div>
            <div id="transcription-container"></div>
        </div>
        <div id="track-selection"></div>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const navTrigger = document.getElementById('trigger');
        const navMenu = document.getElementById('nav-menu');
        let audioLibrary = []; 
        let currentLyricsData = [];
        let lastIndex = -1;

        function toggleNav(e) {
            e.stopPropagation();
            navMenu.classList.toggle('active');
            navTrigger.classList.toggle('open');
        }

        window.onclick = (e) => {
            if (!document.getElementById('nav-container').contains(e.target)) {
                navMenu.classList.remove('active');
                navTrigger.classList.remove('open');
            }
        };

        function update(index, color, n) {
            document.querySelectorAll('.speech-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.speech-item')[index].classList.add('active');
            document.documentElement.style.setProperty('--glow', color);
            document.getElementById('mainNum').style.color = color;
            document.getElementById('mainNum').innerText = n;
            document.getElementById('arc').style.transform = `rotate(${index * 45 - 30}deg)`;
            document.getElementById('dynamic-glow').style.background = `radial-gradient(circle at 90% 50%, ${color}44 0%, transparent 75%)`;
        }

        async function initLibrary() {
            try {
                const response = await fetch('audio/library.json');
                audioLibrary = await response.json();
            } catch (err) { console.error("Library failed"); }
        }
        window.onload = initLibrary;

        function openCategory(folderName, color) {
            const overlay = document.getElementById('library-overlay');
            const selection = document.getElementById('track-selection');
            overlay.style.setProperty('--glow', color);
            selection.innerHTML = '';
            document.getElementById('player-view').style.display = 'none';
            selection.style.display = 'grid';

            const filtered = audioLibrary.filter(t => t.folder === folderName);
            filtered.forEach(track => {
                const card = document.createElement('div');
                card.className = 'track-card';
                card.innerHTML = `<h3 class="font-syncopate font-bold text-lg">${track.title}</h3>`;
                card.onclick = () => loadTrack(track);
                selection.appendChild(card);
            });

            overlay.style.display = 'flex';
            document.getElementById('app-body').classList.add('bg-scale-down');
            setTimeout(() => overlay.classList.add('open'), 10);
        }

        async function loadTrack(track) {
            document.getElementById('track-selection').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            document.getElementById('track-name').innerText = track.title;
            
            audio.src = `audio/${track.folder}/${track.id}.mp3`;
            audio.play();

            try {
                const res = await fetch(`audio/${track.folder}/${track.id}.json`);
                currentLyricsData = await res.json();
                renderLyrics();
            } catch (e) { document.getElementById('transcription-container').innerHTML = "No transcription found."; }
        }

        function renderLyrics() {
            const container = document.getElementById('transcription-container');
            container.innerHTML = currentLyricsData.map((l, i) => `<div class="lyric-line" id="line-${i}">${l.text}</div>`).join('');
            container.scrollTop = 0;
            lastIndex = -1;
        }

        audio.ontimeupdate = () => {
            const time = audio.currentTime;
            document.getElementById('progress-fill').style.width = `${(time / audio.duration) * 100}%`;

            let currentIndex = -1;
            for (let i = 0; i < currentLyricsData.length; i++) {
                if (time >= currentLyricsData[i].start) currentIndex = i;
            }

            if (currentIndex !== -1 && currentIndex !== lastIndex) {
                document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
                const line = document.getElementById(`line-${currentIndex}`);
                if (line) {
                    line.classList.add('active');
                    // SCROLL ENGINE ACTIVE
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                lastIndex = currentIndex;
            }
        };

        function handleBack() {
            if (document.getElementById('player-view').style.display === 'flex') {
                audio.pause();
                document.getElementById('player-view').style.display = 'none';
                document.getElementById('track-selection').style.display = 'grid';
                document.getElementById('lib-title').innerText = "Archive";
            } else {
                document.getElementById('library-overlay').classList.remove('open');
                document.getElementById('app-body').classList.remove('bg-scale-down');
                setTimeout(() => document.getElementById('library-overlay').style.display = 'none', 600);
            }
        }
    </script>
</body>
</html>
