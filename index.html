<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Architect | HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;800;900&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        /* --- ARCHITECTURE CORE --- */
        html, body { 
            position: fixed; width: 100%; height: 100%; 
            overflow: hidden; background: #000000; margin: 0;
            touch-action: none; color: #FFFFFF; font-family: 'Inter', sans-serif;
        }

        #dynamic-glow { 
            position: absolute; inset: 0; z-index: 0; 
            background: radial-gradient(circle at 50% 10%, rgba(201, 160, 80, 0.12) 0%, transparent 60%); 
        }

        body::before {
            content: ""; position: absolute; inset: 0; z-index: 1;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.15; pointer-events: none; mix-blend-mode: overlay;
        }

        #glass-highlight {
            position: absolute; width: 100vw; height: 100vw;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, rgba(201, 160, 80, 0.05) 30%, transparent 70%);
            filter: blur(80px); z-index: 1; pointer-events: none;
            mix-blend-mode: screen; animation: lightMove 15s infinite alternate ease-in-out;
        }

        @keyframes lightMove { 0% { top: -20%; left: -20%; } 100% { top: 20%; left: 80%; } }

        /* --- UI COMPONENTS --- */
        .content-scroll { position: relative; z-index: 10; height: 100%; overflow-y: auto; padding: 25px; padding-bottom: 140px; }

        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(80px); -webkit-backdrop-filter: blur(80px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .bar-track { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; transition: width 2s cubic-bezier(0.16, 1, 0.3, 1); }

        .gold-glow { background: #C9A050; box-shadow: 0 0 15px rgba(201, 160, 80, 0.4); }
        .cyan-glow { background: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .text-shadow { text-shadow: 0 2px 10px rgba(0,0,0,1); }

        /* --- NAVIGATION GIGGLE & LIGHT PROPAGATION --- */
        nav {
            position: fixed; bottom: 25px; left: 20px; right: 20px; 
            height: 75px; z-index: 9999;
            display: flex; items-center justify-around;
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(50px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(50px) saturate(180%) !important;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden; /* Nécessaire pour la lumière qui se propage */
        }

        /* Onde lumineuse circulaire */
        .nav-ripple {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 160, 80, 0.4) 0%, transparent 70%);
            transform: scale(0);
            pointer-events: none;
            z-index: 1;
            transition: transform 0.6s ease-out, opacity 0.6s ease-out;
        }

        /* JIGGLE ANIMATION (GIGGLE) */
        @keyframes jiggleEffect {
            0% { transform: scale(1); }
            30% { transform: scale(0.7) translateY(10px); }
            60% { transform: scale(1.2) translateY(-5px); }
            100% { transform: scale(1); }
        }

        .jiggle { animation: jiggleEffect 0.6s cubic-bezier(0.68, -0.6, 0.32, 1.6); }

        .nav-link { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; gap: 8px; flex: 1; height: 100%;
            opacity: 0.3; transition: 0.3s; color: white; z-index: 2;
            position: relative;
        }
        
        .active-nav { opacity: 1 !important; color: #C9A050 !important; }
        .nav-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; pointer-events: none; }
        .dot { width: 4px; height: 4px; border-radius: 50%; opacity: 0; transition: 0.3s; margin-top: 2px; }
        .active-nav .dot { opacity: 1; background: #C9A050; box-shadow: 0 0 10px #C9A050; }
    </style>
</head>
<body>
    <div id="dynamic-glow"></div>
    <div id="glass-highlight"></div>

    <div class="content-scroll">
        <header class="mb-10 pt-6 flex justify-between items-center px-2">
            <div class="space-y-1">
                <p class="font-mono text-[10px] text-[#C9A050] tracking-[0.7em] uppercase font-bold text-shadow">Architect Protocol</p>
                <h1 class="font-syncopate text-2xl font-bold tracking-tighter uppercase leading-none italic">The Architect</h1>
            </div>
            <div class="w-12 h-12 rounded-full border border-[#C9A05044] flex items-center justify-center glass-card">
                <span class="font-syncopate text-xs font-bold text-[#C9A050]">A</span>
            </div>
        </header>

        <section class="mb-6">
            <div class="glass-card p-6 flex items-center justify-between">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-xl border border-[#C9A05044] flex items-center justify-center bg-black/40">
                        <span class="font-syncopate text-xl font-bold text-white">54</span>
                    </div>
                    <div>
                        <p class="text-[9px] text-white/40 uppercase tracking-[0.4em] font-black mb-1">Rank Status</p>
                        <h2 class="font-syncopate text-base font-bold text-[#C9A050] italic">Master</h2>
                    </div>
                </div>
                <div class="w-1/3">
                    <div class="flex justify-between text-[9px] uppercase tracking-tighter font-bold mb-2">
                        <span class="text-white/30">XP</span> <span class="text-[#C9A050]">82%</span>
                    </div>
                    <div class="bar-track"><div class="bar-fill gold-glow" style="width: 82%"></div></div>
                </div>
            </div>
        </section>

        <section class="mb-6">
            <div class="glass-card p-10 text-center relative overflow-hidden">
                <p class="font-mono text-[10px] text-[#C9A050] tracking-[0.6em] uppercase mb-4 opacity-80 text-shadow">Daily Fuel Status</p>
                <div class="flex justify-center items-center py-4">
                    <span class="font-syncopate font-black leading-none tracking-tighter text-white text-[28vw] text-shadow">2450</span>
                </div>
                <p class="font-mono text-[11px] text-white/20 tracking-[1em] uppercase mt-2">Kilo-Calories</p>
            </div>
        </section>

        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-5 space-y-4">
                <div class="flex justify-between items-center">
                    <p class="text-[9px] font-black text-white/30 uppercase tracking-widest">Sovereignty</p>
                    <span class="font-syncopate text-[11px] font-bold text-[#C9A050]">75</span>
                </div>
                <div class="bar-track"><div class="bar-fill gold-glow" style="width: 75%"></div></div>
            </div>
            <div class="glass-card p-5 space-y-4">
                <div class="flex justify-between items-center">
                    <p class="text-[9px] font-black text-white/30 uppercase tracking-widest">Precision</p>
                    <span class="font-syncopate text-[11px] font-bold text-[#00FFFF]">92</span>
                </div>
                <div class="bar-track"><div class="bar-fill cyan-glow" style="width: 92%"></div></div>
            </div>
        </div>
    </div>

    <nav id="bottom-nav">
        <a href="index.html" class="nav-link active-nav">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <div class="dot"></div>
        </a>
        <a href="neural.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
            <div class="dot"></div>
        </a>
        <a href="fuel.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 7V12l3 3"/></svg>
            <div class="dot"></div>
        </a>
        <a href="speech.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="10" width="3" height="4"/><rect x="8" y="6" width="3" height="12"/><rect x="14" y="3" width="3" height="18"/></svg>
            <div class="dot"></div>
        </a>
        <a href="stats.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
            <div class="dot"></div>
        </a>
    </nav>

    <script>
        const nav = document.getElementById('bottom-nav');
        const links = document.querySelectorAll('.nav-link');

        links.forEach(link => {
            link.addEventListener('click', (e) => {
                // 1. Déclenche le Jiggle sur l'icône
                link.classList.remove('jiggle');
                void link.offsetWidth; // Trigger reflow
                link.classList.add('jiggle');

                // 2. Propagation circulaire de la lumière (Ripple)
                const ripple = document.createElement('span');
                ripple.classList.add('nav-ripple');
                
                // Calcul de la position par rapport au nav
                const rect = nav.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.style.width = ripple.style.height = `200px`; // Taille de la propagation
                ripple.style.marginTop = ripple.style.marginLeft = `-100px`;

                nav.appendChild(ripple);

                // Animation
                requestAnimationFrame(() => {
                    ripple.style.transform = 'scale(2)';
                    ripple.style.opacity = '0';
                });

                // Nettoyage
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body>
</html>
