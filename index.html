<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;800&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #010203; color: white; font-family: 'Inter', sans-serif; padding: 20px; margin: 0; overflow-x: hidden; }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at 50% 10%, rgba(201, 160, 80, 0.05) 0%, transparent 50%), #010203; }

        .glass-card { background: rgba(255, 255, 255, 0.02); border: 0.5px solid rgba(255, 255, 255, 0.05); border-radius: 20px; position: relative; }
        .glow-dot { width: 8px; height: 8px; border-radius: 50%; }
        
        .bar-track { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; transition: width 2s cubic-bezier(0.19, 1, 0.22, 1); }

        .gold-glow { box-shadow: 0 0 15px rgba(201, 160, 80, 0.5); background: #C9A050; }
        .red-glow { box-shadow: 0 0 15px rgba(255, 51, 102, 0.5); background: #FF3366; }
        .cyan-glow { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); background: #00FFFF; }
    </style>
</head>
<body class="pb-32">
    <div class="animated-bg"></div>

    <header class="mb-10 pt-4 flex justify-between items-center px-2">
        <div class="space-y-1">
            <p class="font-mono text-[8px] text-[#C9A050] tracking-[0.5em] uppercase font-bold opacity-80">SYSTEM: OPTIMAL</p>
            <h1 class="font-syncopate text-lg font-bold tracking-tighter uppercase leading-none">The Architect</h1>
        </div>
        <div class="w-10 h-10 rounded-full border border-[#C9A05033] flex items-center justify-center">
            <span class="font-syncopate text-[10px] font-bold text-[#C9A050]">A</span>
        </div>
    </header>

    <section class="mb-8 px-2">
        <div class="glass-card p-5 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 glass-card border-[#C9A05044] flex items-center justify-center">
                    <span class="font-syncopate text-lg font-bold text-white">54</span>
                </div>
                <div>
                    <p class="text-[9px] text-white/30 uppercase tracking-[0.3em] font-bold">Rank</p>
                    <h2 class="font-syncopate text-sm font-bold text-[#C9A050]">Master</h2>
                </div>
            </div>
            <div class="w-1/2">
                <div class="flex justify-between text-[8px] uppercase tracking-widest font-bold mb-2">
                    <span class="text-white/40">XP</span> <span class="text-white">82%</span>
                </div>
                <div class="bar-track"><div class="bar-fill gold-glow" style="width: 82%"></div></div>
            </div>
        </div>
    </section>

    <section class="mb-8 px-2">
        <div class="glass-card p-10 text-center relative">
            <p class="font-mono text-[9px] text-[#C9A050] tracking-[0.6em] uppercase mb-4 opacity-60">Daily Fuel Status</p>
            <div class="flex justify-center items-center overflow-hidden">
                <span class="font-syncopate font-black leading-none tracking-tighter text-white text-[22vw] whitespace-nowrap">2450</span>
            </div>
            <p class="font-mono text-[10px] text-white/20 tracking-[0.8em] uppercase mt-4">Kilo-Calories</p>
        </div>
    </section>

    <div class="grid grid-cols-2 gap-4 px-2 mb-8">
        <div class="glass-card p-5 space-y-4">
            <div class="flex justify-between items-center w-full mb-1">
                <div class="flex items-center gap-2">
                    <span class="glow-dot gold-glow"></span>
                    <p class="text-[8px] font-bold text-white/40 uppercase tracking-widest">Sovereignty</p>
                </div>
                <div class="font-syncopate text-[10px] font-bold">75<span class="text-[8px] opacity-20">/100</span></div>
            </div>
            <div class="bar-track"><div class="bar-fill gold-glow" style="width: 75%"></div></div>
        </div>

        <div class="glass-card p-5 space-y-4">
            <div class="flex justify-between items-center w-full mb-1">
                <div class="flex items-center gap-2">
                    <span class="glow-dot cyan-glow"></span>
                    <p class="text-[8px] font-bold text-white/40 uppercase tracking-widest">Precision</p>
                </div>
                <div class="font-syncopate text-[10px] font-bold text-[#00FFFF]">92<span class="text-[8px] opacity-20">/100</span></div>
            </div>
            <div class="bar-track"><div class="bar-fill cyan-glow" style="width: 92%"></div></div>
        </div>

        <div class="glass-card p-5 space-y-4">
            <div class="flex justify-between items-center w-full mb-1">
                <div class="flex items-center gap-2">
                    <span class="glow-dot red-glow"></span>
                    <p class="text-[8px] font-bold text-white/40 uppercase tracking-widest">Combat</p>
                </div>
                <div class="font-syncopate text-[10px] font-bold text-[#FF3366]">80<span class="text-[8px] opacity-20">/100</span></div>
            </div>
            <div class="bar-track"><div class="bar-fill red-glow" style="width: 80%"></div></div>
        </div>

        <div class="glass-card p-5 space-y-4">
            <div class="flex justify-between items-center w-full mb-1">
                <div class="flex items-center gap-2">
                    <span class="glow-dot bg-white shadow-[0_0_10px_white]"></span>
                    <p class="text-[8px] font-bold text-white/40 uppercase tracking-widest">Alpha</p>
                </div>
                <div class="font-syncopate text-[10px] font-bold">65<span class="text-[8px] opacity-20">/100</span></div>
            </div>
            <div class="bar-track"><div class="bar-fill bg-white shadow-[0_0_10px_white]" style="width: 65%"></div></div>
        </div>
    </div>

<nav class="fixed bottom-0 left-0 w-full h-20 bg-black/95 backdrop-blur-md border-t border-white/5 flex items-center justify-around z-[100]">
    
    <a href="index.html" class="flex flex-col items-center gap-1.5 flex-1 transition-all hover:opacity-100 opacity-50 active-nav" id="nav-home">
        <div class="dot w-1 h-1 rounded-full bg-[#C9A050] shadow-[0_0_8px_#C9A050] opacity-0"></div>
        <span class="text-xl">♞</span>
    </a>

    <a href="neural.html" class="flex flex-col items-center gap-1.5 flex-1 transition-all hover:opacity-100 opacity-50" id="nav-neural">
        <div class="dot w-1 h-1 rounded-full bg-[#00FFFF] shadow-[0_0_8px_#00FFFF] opacity-0"></div>
        <span class="text-xl">🧠</span>
    </a>

    <a href="speech.html" class="flex flex-col items-center gap-1.5 flex-1 transition-all hover:opacity-100 opacity-50" id="nav-speech">
        <div class="dot w-1 h-1 rounded-full bg-[#FF3366] shadow-[0_0_8px_#FF3366] opacity-0"></div>
        <span class="text-xl">⚔️</span>
    </a>

    <a href="app.html" class="flex flex-col items-center gap-1.5 flex-1 transition-all hover:opacity-100 opacity-50" id="nav-app">
        <div class="dot w-1 h-1 rounded-full bg-[#FFFFFF] shadow-[0_0_8px_#FFFFFF] opacity-0"></div>
        <span class="text-xl">📊</span>
    </a>

</nav>

<style>
    /* Sur chaque page, tu peux ajouter cette classe au lien correspondant pour l'allumer */
    .active-nav { opacity: 1 !important; }
    .active-nav .dot { opacity: 1 !important; }
</style>
</body>
</html>
