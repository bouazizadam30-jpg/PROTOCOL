<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Status | War Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        syncopate: ['Syncopate', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        onyx: '#010203',
                        gold: '#C9A050',
                        dopa: '#FF3366', 
                        testo: '#FFD700', 
                        sero: '#00FFFF', 
                    }
                }
            }
        }
    </script>

    <style>
        body { margin: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; background: #010203; color: #F5F5F7; }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at 50% 30%, rgba(20, 20, 20, 0.4) 0%, transparent 70%), linear-gradient(180deg, #010203 0%, #000000 100%); }

        #canvas-container { 
            width: 100%; height: 45vh; 
            display: flex; justify-content: center; align-items: center;
            filter: drop-shadow(0 0 60px rgba(255, 255, 255, 0.05));
        }

        .glass-panel { background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 32px; }
        
        .progress-track { height: 6px; background: rgba(255, 255, 255, 0.03); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 2s cubic-bezier(0.22, 1, 0.36, 1); }
        
        .fill-dopa { background: linear-gradient(90deg, #FF3366, #FF80AB); box-shadow: 0 0 20px rgba(255, 51, 102, 0.6); }
        .fill-testo { background: linear-gradient(90deg, #FFD700, #FFF59D); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        .fill-sero { background: linear-gradient(90deg, #00FFFF, #80FFFF); box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }

        .glow-circle { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 16px; }
        .circle-dopa { background: #FF3366; box-shadow: 0 0 15px #FF3366; }
        .circle-testo { background: #FFD700; box-shadow: 0 0 15px #FFD700; }
        .circle-sero { background: #00FFFF; box-shadow: 0 0 15px #00FFFF; }

        .text-dopa { color: #FF3366; } .text-testo { color: #FFD700; } .text-sero { color: #00FFFF; }
    </style>
</head>
<body class="p-6 flex flex-col min-h-screen">
    <div class="animated-bg"></div>

    <header class="pt-6 mb-4 text-center">
        <p class="font-inter text-[10px] font-semibold text-white/30 tracking-[0.5em] uppercase mb-2">Architect Protocol</p>
        <h1 class="font-syncopate text-2xl font-bold text-white tracking-tight uppercase">Neural Status</h1>
    </header>

    <div id="canvas-container"></div>

    <div class="glass-panel p-8 space-y-10 max-w-md mx-auto w-full border border-white/5">
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <span class="glow-circle circle-dopa"></span>
                    <div>
                        <p class="font-inter text-sm font-bold text-white tracking-wide">Dopamine</p>
                        <p class="font-inter text-[10px] text-white/25 uppercase tracking-[0.2em]">Drive & Motivation</p>
                    </div>
                </div>
                <span class="font-inter font-black text-lg text-dopa">85%</span>
            </div>
            <div class="progress-track"><div class="progress-fill fill-dopa w-0" data-width="85%"></div></div>
        </div>

        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <span class="glow-circle circle-testo"></span>
                    <div>
                        <p class="font-inter text-sm font-bold text-white tracking-wide">Testosterone</p>
                        <p class="font-inter text-[10px] text-white/25 uppercase tracking-[0.2em]">Power & Vitality</p>
                    </div>
                </div>
                <span class="font-inter font-black text-lg text-testo">92%</span>
            </div>
            <div class="progress-track"><div class="progress-fill fill-testo w-0" data-width="92%"></div></div>
        </div>

        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <span class="glow-circle circle-sero"></span>
                    <div>
                        <p class="font-inter text-sm font-bold text-white tracking-wide">Serotonin</p>
                        <p class="font-inter text-[10px] text-white/25 uppercase tracking-[0.2em]">Mental Stability</p>
                    </div>
                </div>
                <span class="font-inter font-black text-lg text-sero">64%</span>
            </div>
            <div class="progress-track"><div class="progress-fill fill-sero w-0" data-width="64%"></div></div>
        </div>
    </div>

    <script>
        const LEVELS = { dopa: 0.85, testo: 0.92, sero: 0.64 };

        const initNeuralHologram = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(22, 2, 8); 
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio * 2);
            container.appendChild(renderer.domElement);

            const total = 80000; 
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(total * 3);
            const colors = new Float32Array(total * 3);

            // Base noire pour contraste Matter
            const colBase = new THREE.Color(0x060606); 
            const colDopa = new THREE.Color(0xFF3366);
            const colTesto = new THREE.Color(0xFFD700);
            const colSero = new THREE.Color(0x00FFFF);

            // Centres stratégiques
            const dCenter = new THREE.Vector3(0, 0.3, 2.0); 
            const sCenter = new THREE.Vector3(0, 2.0, 0);
            const tCenter = new THREE.Vector3(0, -1.3, -1.3);

            for (let i = 0; i < total; i++) {
                let x, y, z;
                if (i < 58000) { 
                    const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
                    const r = (2.1 + Math.sin(theta * 8) * Math.cos(phi * 8) * 0.12) * 1.6;
                    x = r * Math.sin(phi) * Math.cos(theta) * 1.35; y = r * Math.sin(phi) * Math.sin(theta) * 0.9; z = r * Math.cos(phi) * 1.8;
                    if (Math.abs(x) < 0.8) x *= 0.78; if (y < -0.8) y *= 0.7;
                } else if (i < 72000) {
                    const theta = Math.random() * Math.PI + Math.PI; const phi = Math.random() * Math.PI * 0.4 + Math.PI * 0.4;
                    const r = (1.4 + Math.sin(theta*12)*0.05) * 1.1;
                    x = r * Math.sin(phi) * Math.cos(theta) * 1.4; y = r * Math.sin(phi) * Math.sin(theta) * 0.6 - 1.8; z = r * Math.cos(phi) * 1.0 - 1.6;
                } else {
                    const h = Math.random(); const r = (0.4 + Math.exp(-Math.pow(h - 0.2, 2) / 0.05) * 0.3) * (1.1 - h * 0.7);
                    x = (Math.random()-0.5)*0.9; y = -1.6-(h*3.4); z = (Math.random()-0.5)*0.9-(h*0.6)-1.0;
                }
                pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;

                const currentPos = new THREE.Vector3(x, y, z);
                let finalCol = colBase.clone();

                // --- LOGIQUE DE PROPAGATION (RAYON DÉPEND DU %) ---
                // Le rayon maximum est multiplié par le niveau pour faire "grandir" la couleur
                const radD = 3.5 * LEVELS.dopa;
                const radS = 3.0 * LEVELS.sero;
                const radT = 2.8 * LEVELS.testo;

                const dDist = currentPos.distanceTo(dCenter);
                const sDist = currentPos.distanceTo(sCenter);
                const tDist = currentPos.distanceTo(tCenter);

                const infD = Math.max(0, 1 - dDist / radD);
                const infS = Math.max(0, 1 - sDist / radS);
                const infT = Math.max(0, 1 - tDist / radT);

                // Intensité boostée pour le contraste
                finalCol.add(colDopa.clone().multiplyScalar(infD * 6.5));
                finalCol.add(colSero.clone().multiplyScalar(infS * 6.0));
                finalCol.add(colTesto.clone().multiplyScalar(infT * 7.5));

                colors[i*3] = finalCol.r;
                colors[i*3+1] = finalCol.g;
                colors[i*3+2] = finalCol.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ 
                size: 0.015, vertexColors: true, transparent: true, opacity: 1.0, 
                blending: THREE.AdditiveBlending, depthWrite: false 
            });

            const brain = new THREE.Points(geo, mat);
            scene.add(brain);

            const animate = () => {
                brain.rotation.y += 0.002;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            };
            animate();
        };

        window.onload = () => {
            initNeuralHologram();
            setTimeout(() => {
                document.querySelectorAll('.progress-fill').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-width');
                });
            }, 300);
        };
    </script>
</body>
</html>
