<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Status | Architect Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;900&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; background: #000000; margin: 0; touch-action: none; color: #FFFFFF; font-family: 'Inter', sans-serif; }
        #dynamic-glow { position: absolute; inset: 0; z-index: 0; background: radial-gradient(circle at 50% 30%, rgba(0, 255, 255, 0.12) 0%, transparent 70%); }
        #glass-highlight { position: absolute; width: 90vw; height: 90vw; background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, rgba(0,255,255,0.1) 30%, transparent 70%); filter: blur(60px); z-index: 1; pointer-events: none; mix-blend-mode: screen; animation: lightMove 18s infinite alternate ease-in-out; }
        @keyframes lightMove { 0% { top: -20%; left: -10%; } 100% { top: 80%; left: 50%; } }
        .visual-anchor { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); width: 140vw; height: 140vw; max-width: 900px; max-height: 900px; z-index: 0; pointer-events: none; opacity: 0.1; }
        .rotating-arc { width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.03); border-left: 4px solid #00FFFF; filter: blur(2px); animation: slowRotate 20s linear infinite; }
        @keyframes slowRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- NAVIGATION GHOST PILL (GLOSSY SCAN) --- */
        #nav-container { position: fixed; top: 25px; left: 20px; right: 20px; z-index: 9999; display: flex; align-items: center; pointer-events: auto; }

        .nav-trigger {
            width: 40px; height: 10px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.6s cubic-bezier(0.68, -0.6, 0.32, 1.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* EFFET RAYON LUMINEUX INTERNE (GLOSSY) */
        .nav-trigger::after {
            content: ""; position: absolute; top: 0; left: -100%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(2, 139, 73, 0.5), transparent);
            animation: glossMove 4s infinite ease-in-out;
        }

        @keyframes glossMove {
            0% { left: -100%; }
            30% { left: 120%; }
            100% { left: 120%; }
        }

        .nav-trigger.open { width: 12px; height: 12px; border-radius: 50%; background: #027e69; border-color: #046e49; box-shadow: 0 0 20px rgba(1, 130, 81, 0.8); }
        .nav-trigger.open::after { display: none; }

        #nav-menu {
            display: flex; align-items: center; justify-content: space-around;
            width: 0; opacity: 0; overflow: hidden;
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap; transform: translateX(-10px);
        }
        #nav-menu.active { width: calc(100% - 30px); opacity: 1; margin-left: 15px; padding: 4px; transform: translateX(0); }

        .nav-item { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; color: white; opacity: 0.35; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: #04c88a; background: rgba(201, 160, 80, 0.05); }
        .nav-icon-svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* UI Layers - Unchanged */
        .content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
        .content-layer header, .content-layer .glass-panel { pointer-events: auto; }
        #canvas-container { width: 100%; height: 45vh; z-index: 5; display: flex; justify-content: center; align-items: center; }
        .category-badge { display: inline-block; padding: 6px 14px; border-radius: 6px; font-family: 'Inter'; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; border: 1.5px solid #00FFFF; color: #00FFFF; background: rgba(0, 255, 255, 0.1); margin-bottom: 15px; }
        .glass-panel { background: rgba(2, 2, 2, 0.45); backdrop-filter: blur(80px); -webkit-backdrop-filter: blur(80px); border-top: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px 40px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,0.9); margin-top: auto; }
        .progress-track { height: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 2s cubic-bezier(0.16, 1, 0.3, 1); }
        .fill-dopa { background: #FF3366; box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); }
        .fill-testo { background: #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .fill-sero { background: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .glass-panel p, .glass-panel span { text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    </style>
</head>
<body>
    <div id="dynamic-glow"></div>
    <div id="glass-highlight"></div>
    <div class="visual-anchor"><div class="rotating-arc"></div></div>

    <div id="nav-container">
        <div class="nav-trigger" id="trigger" onclick="toggleNav(event)"></div>
        <div id="nav-menu">
            <a href="index.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">HQ</span>
            </a>
            <a href="neural.html" class="nav-item active">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Neural</span>
            </a>
            <a href="fuel.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 7V12l3 3"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Fuel</span>
            </a>
            <a href="speech.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="2" y="10" width="3" height="4"/><rect x="8" y="6" width="3" height="12"/><rect x="14" y="3" width="3" height="18"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase tracking-widest">Speech</span>
            </a>
        </div>
    </div>

    <div class="content-layer">
        <header class="pt-16 pb-4 text-center">
            <p class="font-mono text-[11px] text-[#C9A050] tracking-[0.7em] uppercase font-bold mb-4">Architect Protocol</p>
            <h1 class="font-syncopate text-4xl font-bold text-white tracking-tighter uppercase italic leading-none">Neural Status</h1>
        </header>

        <div id="canvas-container"></div>

        <div class="glass-panel p-10 space-y-9">
            <div class="text-center mb-2">
                <span class="category-badge">Neural Core</span>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-end">
                    <div><p class="font-syncopate text-[10px] text-[#FF3366] font-bold tracking-widest uppercase mb-1">Dopamine</p></div>
                    <span class="font-syncopate font-black text-xl">85%</span>
                </div>
                <div class="progress-track"><div class="progress-fill fill-dopa" style="width: 85%"></div></div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-end">
                    <div><p class="font-syncopate text-[10px] text-[#FFD700] font-bold tracking-widest uppercase mb-1">Testosterone</p></div>
                    <span class="font-syncopate font-black text-xl">92%</span>
                </div>
                <div class="progress-track"><div class="progress-fill fill-testo" style="width: 92%"></div></div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-end">
                    <div><p class="font-syncopate text-[10px] text-[#00FFFF] font-bold tracking-widest uppercase mb-1">Serotonin</p></div>
                    <span class="font-syncopate font-black text-xl">64%</span>
                </div>
                <div class="progress-track"><div class="progress-fill fill-sero" style="width: 64%"></div></div>
            </div>
        </div>
    </div>

    <script>
        const navTrigger = document.getElementById('trigger');
        const navMenu = document.getElementById('nav-menu');
        function toggleNav(e) { e.stopPropagation(); navMenu.classList.toggle('active'); navTrigger.classList.toggle('open'); }
        window.onclick = (e) => { if (!document.getElementById('nav-container').contains(e.target)) { navMenu.classList.remove('active'); navTrigger.classList.remove('open'); } };

        // THREE.JS LOGIC INTACTE
        const LEVELS = { dopa: 0.85, testo: 0.92, sero: 0.64 };
        const initNeuralHologram = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(22, 2, 8); camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio * 2);
            container.appendChild(renderer.domElement);
            const total = 80000; const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(total * 3); const colors = new Float32Array(total * 3);
            const colBase = new THREE.Color(0x060606); const colDopa = new THREE.Color(0xFF3366);
            const colTesto = new THREE.Color(0xFFD700); const colSero = new THREE.Color(0x00FFFF);
            const dCenter = new THREE.Vector3(0, 0.3, 2.0); const sCenter = new THREE.Vector3(0, 2.0, 0); const tCenter = new THREE.Vector3(0, -1.3, -1.3);
            for (let i = 0; i < total; i++) {
                let x, y, z;
                if (i < 58000) { const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1); const r = (2.1 + Math.sin(theta * 8) * Math.cos(phi * 8) * 0.12) * 1.6; x = r * Math.sin(phi) * Math.cos(theta) * 1.35; y = r * Math.sin(phi) * Math.sin(theta) * 0.9; z = r * Math.cos(phi) * 1.8; if (Math.abs(x) < 0.8) x *= 0.78; if (y < -0.8) y *= 0.7; } else if (i < 72000) { const theta = Math.random() * Math.PI + Math.PI; const phi = Math.random() * Math.PI * 0.4 + Math.PI * 0.4; const r = (1.4 + Math.sin(theta*12)*0.05) * 1.1; x = r * Math.sin(phi) * Math.cos(theta) * 1.4; y = r * Math.sin(phi) * Math.sin(theta) * 0.6 - 1.8; z = r * Math.cos(phi) * 1.0 - 1.6; } else { const h = Math.random(); const r = (0.4 + Math.exp(-Math.pow(h - 0.2, 2) / 0.05) * 0.3) * (1.1 - h * 0.7); x = (Math.random()-0.5)*0.9; y = -1.6-(h*3.4); z = (Math.random()-0.5)*0.9-(h*0.6)-1.0; }
                pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
                const currentPos = new THREE.Vector3(x, y, z); let finalCol = colBase.clone();
                const radD = 3.5 * LEVELS.dopa; const radS = 3.0 * LEVELS.sero; const radT = 2.8 * LEVELS.testo;
                const dDist = currentPos.distanceTo(dCenter); const sDist = currentPos.distanceTo(sCenter); const tDist = currentPos.distanceTo(tCenter);
                const infD = Math.max(0, 1 - dDist / radD); const infS = Math.max(0, 1 - sDist / radS); const infT = Math.max(0, 1 - tDist / radT);
                finalCol.add(colDopa.clone().multiplyScalar(infD * 6.5)); finalCol.add(colSero.clone().multiplyScalar(infS * 6.0)); finalCol.add(colTesto.clone().multiplyScalar(infT * 7.5));
                colors[i*3] = finalCol.r; colors[i*3+1] = finalCol.g; colors[i*3+2] = finalCol.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.015, vertexColors: true, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false });
            const brain = new THREE.Points(geo, mat); scene.add(brain);
            const animate = () => { brain.rotation.y += 0.002; renderer.render(scene, camera); requestAnimationFrame(animate); };
            animate();
        };
        window.onload = initNeuralHologram;
    </script>
</body>
</html>
