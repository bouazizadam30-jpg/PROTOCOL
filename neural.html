<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Status | Architect Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;900&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --active-cyan: #00FFFF; }
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; background: #000; margin: 0; color: #FFF; font-family: 'Inter'; }
        #dynamic-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, rgba(0, 255, 255, 0.08) 0%, transparent 70%); }
        
        /* NAVIGATION PILL */
        #nav-container { position: fixed; top: 30px; left: 25px; z-index: 5000; display: flex; align-items: center; }
        .nav-trigger { width: 42px; height: 12px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: 0.6s; flex-shrink: 0; }
        .nav-trigger.open { width: 12px; height: 12px; border-radius: 50%; background: var(--active-cyan); box-shadow: 0 0 20px var(--active-cyan); }
        #nav-menu { display: flex; align-items: center; width: 0; opacity: 0; overflow: hidden; background: rgba(255,255,255,0.02); backdrop-filter: blur(50px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; }
        #nav-menu.active { width: 340px; opacity: 1; margin-left: 15px; padding: 4px; }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: white; opacity: 0.3; text-decoration: none; }
        .nav-item.active { opacity: 1; color: var(--active-cyan); }
        .nav-icon-svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        #canvas-container { width: 100%; height: 50vh; display: flex; justify-content: center; align-items: center; }
        .glass-panel { background: rgba(2, 2, 2, 0.6); backdrop-filter: blur(40px); border-top: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px 40px 0 0; padding: 40px 30px; position: absolute; bottom: 0; width: 100%; z-index: 10; }
        .progress-track { height: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; transition: width 2s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body>
    <div id="dynamic-glow"></div>

    <div id="nav-container">
        <div class="nav-trigger" id="trigger" onclick="toggleNav(event)"></div>
        <div id="nav-menu">
            <a href="index.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase">HQ</span>
            </a>
            <a href="neural.html" class="nav-item active">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase">Neural</span>
            </a>
            <a href="fuel.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 7V12l3 3"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase">Fuel</span>
            </a>
            <a href="speech.html" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="2" y="10" width="3" height="4"/><rect x="8" y="6" width="3" height="12"/><rect x="14" y="3" width="3" height="18"/></svg>
                <span class="font-syncopate text-[8px] font-bold uppercase">Speech</span>
            </a>
        </div>
    </div>

    <div class="pt-24 text-center">
        <p class="font-mono text-[10px] text-[#00FFFF] tracking-[0.7em] uppercase font-bold">Biologic OS</p>
        <h1 class="font-syncopate text-4xl font-bold italic">Neural Status</h1>
    </div>

    <div id="canvas-container"></div>

    <div class="glass-panel space-y-8">
        <div class="space-y-2">
            <div class="flex justify-between font-syncopate text-[10px] uppercase">
                <span class="text-[#FF3366]">Dopamine (Drive)</span>
                <span id="val-dopa">0%</span>
            </div>
            <div class="progress-track"><div id="bar-dopa" class="progress-fill bg-[#FF3366]" style="width: 0%"></div></div>
        </div>
        <div class="space-y-2">
            <div class="flex justify-between font-syncopate text-[10px] uppercase">
                <span class="text-[#00FFFF]">Serotonin (Stability)</span>
                <span id="val-sero">0%</span>
            </div>
            <div class="progress-track"><div id="bar-sero" class="progress-fill bg-[#00FFFF]" style="width: 0%"></div></div>
        </div>
        <div class="space-y-2">
            <div class="flex justify-between font-syncopate text-[10px] uppercase">
                <span class="text-[#FFD700]">Testosterone (Power)</span>
                <span id="val-testo">0%</span>
            </div>
            <div class="progress-track"><div id="bar-testo" class="progress-fill bg-[#FFD700]" style="width: 0%"></div></div>
        </div>
    </div>

    <script>
        let protocolData = JSON.parse(localStorage.getItem('architect_fuel_v1')) || {};
        const today = new Date();
        const todayKey = `kcal count ${today.getDate().toString().padStart(2, '0')}/${(today.getMonth() + 1).toString().padStart(2, '0')}/${today.getFullYear()}`;
        
        // --- LOGIQUE DE CALCUL NEURAL ---
        const calculateLiveLevels = () => {
            const data = protocolData[todayKey];
            if (!data || !data.meals.length) return { dopa: 0.15, sero: 0.15, testo: 0.15 }; // Baseline low

            // Si le rapport IA existe déjà, on utilise les vraies valeurs
            if (data.report && data.report.neural) {
                return {
                    dopa: data.report.neural.dopamine / 100,
                    sero: data.report.neural.serotonin / 100,
                    testo: data.report.neural.testo / 100
                };
            }

            // Sinon, estimation live basée sur les mots-clés des repas
            let d = 0.2, s = 0.2, t = 0.2;
            const text = data.meals.map(m => m.name + m.ingredients.join('')).join(' ').toLowerCase();

            if (text.includes('salmon') || text.includes('egg') || text.includes('meat') || text.includes('protein')) d += 0.4;
            if (text.includes('coffee') || text.includes('tea')) d += 0.2;
            if (text.includes('rice') || text.includes('quinoa') || text.includes('fiber') || text.includes('oat')) s += 0.5;
            if (text.includes('avocado') || text.includes('oil') || text.includes('nuts') || text.includes('fat')) t += 0.4;
            
            return { dopa: Math.min(d, 1), sero: Math.min(s, 1), testo: Math.min(t, 1) };
        };

        const LEVELS = calculateLiveLevels();

        function toggleNav(e) { e.stopPropagation(); document.getElementById('nav-menu').classList.toggle('active'); document.getElementById('trigger').classList.toggle('open'); }

        // --- THREE.JS HOLOGRAPHIC ENGINE ---
        const initNeuralHologram = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(20, 2, 8); camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const total = 60000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(total * 3);
            const colors = new Float32Array(total * 3);

            const colDopa = new THREE.Color(0xFF3366);
            const colSero = new THREE.Color(0x00FFFF);
            const colTesto = new THREE.Color(0xFFD700);

            for (let i = 0; i < total; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = (2.0 + Math.random() * 0.1) * 1.5;
                
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta) * 0.8;
                const z = r * Math.cos(phi) * 1.2;

                pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;

                // Color coverage logic
                let color = new THREE.Color(0x111111);
                if (z > 1.5 && Math.random() < LEVELS.dopa) color.lerp(colDopa, 0.8); // Frontal = Dopa
                if (y > 1.0 && Math.random() < LEVELS.sero) color.lerp(colSero, 0.8); // Top = Sero
                if (y < -1.0 && Math.random() < LEVELS.testo) color.lerp(colTesto, 0.8); // Base = Testo

                colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            const brain = new THREE.Points(geo, mat);
            scene.add(brain);

            const animate = () => {
                brain.rotation.y += 0.003;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            };

            // Update UI Bars
            document.getElementById('val-dopa').innerText = Math.round(LEVELS.dopa * 100) + '%';
            document.getElementById('bar-dopa').style.width = (LEVELS.dopa * 100) + '%';
            document.getElementById('val-sero').innerText = Math.round(LEVELS.sero * 100) + '%';
            document.getElementById('bar-sero').style.width = (LEVELS.sero * 100) + '%';
            document.getElementById('val-testo').innerText = Math.round(LEVELS.testo * 100) + '%';
            document.getElementById('bar-testo').style.width = (LEVELS.testo * 100) + '%';

            animate();
        };

        window.onload = initNeuralHologram;
    </script>
</body>
</html>
