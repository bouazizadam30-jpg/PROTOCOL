<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Status | Architect Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;900&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --dopa: #FF3366; 
            --sero: #00FFFF; 
            --testo: #FFD700; 
        }
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; background: #000; margin: 0; color: #FFF; font-family: 'Inter'; }
        #dynamic-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% -20%, rgba(0, 255, 255, 0.15) 0%, transparent 70%); z-index: 0; }

        .reactor-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(50px); 
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 30px; 
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

        .neon-track { height: 14px; background: rgba(255, 255, 255, 0.03); border-radius: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-fill { 
            height: 100%; 
            border-radius: 20px; 
            width: 0%; 
            transition: width 3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 0 30px var(--current-color);
        }

        .neon-fill::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: flow 2s infinite linear;
        }
        @keyframes flow { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* NAV MENU */
        #nav-container { position: fixed; top: 30px; left: 25px; z-index: 5000; display: flex; align-items: center; }
        .nav-trigger { width: 42px; height: 12px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: 0.6s; flex-shrink: 0; }
        .nav-trigger.open { width: 12px; height: 12px; border-radius: 50%; background: #00FFFF; box-shadow: 0 0 20px #00FFFF; }
        #nav-menu { display: flex; align-items: center; width: 0; opacity: 0; overflow: hidden; background: rgba(255,255,255,0.02); backdrop-filter: blur(50px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; }
        #nav-menu.active { width: 340px; opacity: 1; margin-left: 15px; padding: 4px; }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: white; opacity: 0.3; text-decoration: none; }
        .nav-item.active { opacity: 1; color: #00FFFF; }
    </style>
</head>
<body>
    <div id="dynamic-glow"></div>

    <nav id="nav-container">
        <div class="nav-trigger" id="trigger" onclick="toggleNav(event)"></div>
        <div id="nav-menu">
            <a href="index.html" class="nav-item"><span class="font-syncopate text-[8px] font-bold uppercase">HQ</span></a>
            <a href="neural.html" class="nav-item active"><span class="font-syncopate text-[8px] font-bold uppercase">Neural</span></a>
            <a href="fuel.html" class="nav-item"><span class="font-syncopate text-[8px] font-bold uppercase">Fuel</span></a>
            <a href="speech.html" class="nav-item"><span class="font-syncopate text-[8px] font-bold uppercase">Speech</span></a>
        </div>
    </nav>

    <main class="content-scroll h-full flex flex-col px-6 pt-32 pb-10">
        <header class="text-center mb-16">
            <p class="font-mono text-[10px] text-[#00FFFF] tracking-[0.8em] uppercase font-black opacity-60 mb-2">NEURAL_SYNC ACTIVE</p>
            <h1 class="font-syncopate text-4xl font-bold italic tracking-tighter">Neuro-Analysis</h1>
        </header>

        <section class="space-y-8 flex-1">
            <div class="reactor-card" style="--current-color: var(--dopa); animation-delay: 0.1s;">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="font-syncopate text-xs font-black tracking-widest text-[#FF3366]">DOPAMINE</h2>
                        <p class="text-[9px] opacity-40 uppercase font-bold mt-1">Drive • Focus • Reward</p>
                    </div>
                    <span id="val-dopa" class="font-syncopate text-3xl font-black italic">0%</span>
                </div>
                <div class="neon-track"><div id="bar-dopa" class="neon-fill" style="background: var(--dopa); --current-color: var(--dopa);"></div></div>
            </div>

            <div class="reactor-card" style="--current-color: var(--sero); animation-delay: 0.2s;">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="font-syncopate text-xs font-black tracking-widest text-[#00FFFF]">SEROTONIN</h2>
                        <p class="text-[9px] opacity-40 uppercase font-bold mt-1">Mood • Sleep • Stability</p>
                    </div>
                    <span id="val-sero" class="font-syncopate text-3xl font-black italic">0%</span>
                </div>
                <div class="neon-track"><div id="bar-sero" class="neon-fill" style="background: var(--sero); --current-color: var(--sero);"></div></div>
            </div>

            <div class="reactor-card" style="--current-color: var(--testo); animation-delay: 0.3s;">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="font-syncopate text-xs font-black tracking-widest text-[#FFD700]">TESTOSTERONE</h2>
                        <p class="text-[9px] opacity-40 uppercase font-bold mt-1">Strength • Libido • Energy</p>
                    </div>
                    <span id="val-testo" class="font-syncopate text-3xl font-black italic">0%</span>
                </div>
                <div class="neon-track"><div id="bar-testo" class="neon-fill" style="background: var(--testo); --current-color: var(--testo);"></div></div>
            </div>
        </section>
    </main>

    <script>
        function toggleNav(e) { 
            e.stopPropagation(); 
            document.getElementById('nav-menu').classList.toggle('active'); 
            document.getElementById('trigger').classList.toggle('open'); 
        }

        const calculateLevels = () => {
            const rawData = localStorage.getItem('architect_fuel_v1');
            const protocolData = rawData ? JSON.parse(rawData) : {};
            
            const today = new Date();
            const todayKey = `kcal count ${today.getDate().toString().padStart(2, '0')}/${(today.getMonth() + 1).toString().padStart(2, '0')}/${today.getFullYear()}`;
            
            const dayData = protocolData[todayKey];
            
            // Baseline si aucune donnée
            if (!dayData || !dayData.meals || dayData.meals.length === 0) {
                return { dopa: 15, sero: 18, testo: 12 };
            }

            let d = 25, s = 25, t = 25; 
            const text = dayData.meals.map(m => (m.name + (m.ingredients ? m.ingredients.join('') : ''))).join(' ').toLowerCase();

            // DOPAMINE (Tyrosine / Protéines / Caféine)
            const dopaKeywords = ['salmon', 'saumon', 'egg', 'oeuf', 'meat', 'viande', 'chicken', 'poulet', 'steak', 'coffee', 'café', 'caffeine'];
            if (dopaKeywords.some(key => text.includes(key))) d += 45;

            // SEROTONIN (Tryptophane / Glucides complexes)
            const seroKeywords = ['rice', 'riz', 'quinoa', 'oat', 'avoine', 'pasta', 'pâtes', 'banana', 'banane', 'potato', 'pomme de terre'];
            if (seroKeywords.some(key => text.includes(key))) s += 40;

            // TESTOSTERONE (Graisses saines / Zinc)
            const testoKeywords = ['avocado', 'avocat', 'nuts', 'noix', 'oil', 'huile', 'egg', 'oeuf', 'broccoli', 'brocoli'];
            if (testoKeywords.some(key => text.includes(key))) t += 40;
            
            return { 
                dopa: Math.min(d, 98), 
                sero: Math.min(s, 95), 
                testo: Math.min(t, 94) 
            };
        };

        const updateUI = () => {
            const levels = calculateLevels();
            
            const animateElement = (id, val, delay) => {
                setTimeout(() => {
                    document.getElementById(`bar-${id}`).style.width = val + '%';
                    document.getElementById(`val-${id}`).innerText = val + '%';
                }, delay);
            };

            animateElement('dopa', levels.dopa, 500);
            animateElement('sero', levels.sero, 700);
            animateElement('testo', levels.testo, 900);
        };

        window.onload = updateUI;

        // Fermer le menu si on clique ailleurs
        window.onclick = () => {
            document.getElementById('nav-menu').classList.remove('active');
            document.getElementById('trigger').classList.remove('open');
        };
    </script>
</body>
</html>
